<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact | Nivethithai</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #0f172a;
            color: white;
            padding-top: 90px; /* space for navbar */
            font-family: 'Segoe UI', sans-serif;
        }

        /* NAVBAR */
        .navbar {
            height: 90px;
            background-color: #111827 !important;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .navbar .container {
            height: 100%;
            display: flex;
            align-items: center;
        }

        .nav-link {
            margin: 0 12px;
            color: white !important;
        }

        .nav-link:hover {
            color: #0d6efd !important;
        }

        /* CONTACT CARD */
        .contact-card {
            background-color: #111827;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 0 20px rgba(13,110,253,0.4);
        }

        .form-control {
            background-color: #020617;
            border: 1px solid #334155;
            color: white;
        }

        .form-control::placeholder {
            color: #94a3b8;
        }

        .form-control:focus {
            background-color: #020617;
            color: white;
            border-color: #0d6efd;
            box-shadow: none;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">Nivethithai</a>
        <div>
            <a class="nav-link d-inline" href="projects.html">Projects</a>
            <a class="nav-link d-inline" href="certificates.html">Certificates</a>
            <a class="nav-link d-inline text-primary" href="contact.html">Contact</a>
        </div>
    </div>
</nav>

<!-- CONTACT SECTION -->
<div class="container">
    <h2 class="text-center text-primary mb-4">Contact Me</h2>

    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="contact-card">
                <form id="contactForm">

                    <div class="mb-3">
                        <input type="text" class="form-control" id="name" placeholder="Your Name" required>
                    </div>

                    <div class="mb-3">
                        <input type="email" class="form-control" id="email" placeholder="Your Email" required>
                    </div>

                    <div class="mb-3">
                        <textarea class="form-control" id="message" rows="4" placeholder="Your Message" required></textarea>
                    </div>

                    <button type="submit" class="btn btn-success w-100">
                        Send Message
                    </button>

                </form>
            </div>

        </div>
    </div>
</div>

<script>
document.getElementById("contactForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const response = await fetch("http://127.0.0.1:8000/contact", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            name: name.value,
            email: email.value,
            message: message.value
        })
    });

    if (response.ok) {
        alert("Message sent successfully!");
        document.getElementById("contactForm").reset();
    } else {
        alert("Error sending message");
    }
});
</script>

</body>
</html>
